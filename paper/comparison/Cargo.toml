[package]
name = "spirix-paper-comparison"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bit-accurate Spirix v0.1 implementations and IEEE 754 binary32 comparison harnesses for the Spirix paper. Standalone — does not depend on the production spirix crate, so the algorithms shown here directly correspond to the comparison numbers reported in the paper."

[lib]
path = "src/lib.rs"

[package]
name = "spirix"
version = "0.0.11"
edition = "2021"
description = "Two's complement floating-point arithmetic library"
authors = ["Nick Spiker <fractaldecoder@proton.me>"]
license-file = "LICENSE"
keywords = ["mathematics", "floating-point", "numerics", "arithmetic"]
categories = ["mathematics", "algorithms", "no-std"]
readme = "README.md"
repository = "https://github.com/nickspiker/spirix"
homepage = "https://github.com/nickspiker/spirix"
documentation = "https://docs.rs/spirix"
exclude = [
    "gpu/",
    "fpga/",
    "old hip/",
    "docs/",
    "examples/",
    "test_contiguous",
    "test_multiplication_truth",
    "*.hipi",
    "*.bc",
    "*.o",
    "*.s",
    "*.out",
    "target/",
]

[features]
default = ["alloc", "rand", "ieee"]
alloc = []
rand = ["dep:rand"]
prime = ["dep:num-prime"]
ieee = ["dep:num-complex"]

[dependencies]
i256 = "0.2.2"
num-complex = { version = "0.4.6", default-features = false, optional = true }
num-integer = { version = "0.1.46", default-features = false }
num-prime = { version = "0.4.4", optional = true }
num-traits = { version = "0.2.19", default-features = false }
rand = { version = "0.9.0", optional = true }

[dev-dependencies]
proptest = "1.5"
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
paste = "1.0"

[profile.dev]
opt-level = 3
overflow-checks = false
debug = true

[profile.release]
opt-level = 3
overflow-checks = false
debug = false

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "sqrt_benchmark"
harness = false
